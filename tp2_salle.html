
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TP2 - Salle XR interactive</title>
<!-- Version figée : on note toujours la version utilisée (reproductibilité) -->
<script src="https://cdn.jsdelivr.net/npm/aframe@1.7.1/dist/aframe-v1.7.1.min.js"></script>
<style>
  #hud { position: fixed; bottom: 8px; left: 8px; right: 8px; z-index: 10; pointer-events: none;
         font: 600 16px system-ui, sans-serif; color: #fff; text-shadow: 0 0 4px #000, 0 0 4px #000; }
</style>
</head>
<body>
<div id="hud">Visez avec le point blanc, touchez l'écran pour agir.</div>


<a-scene id="scene" stats vr-mode-ui="enabled: false" renderer="antialias: true">


  <!-- TEST : ces deux lignes seront remplacées à l'étape B -->

<!-- ============ BLOC 1 : ENVIRONNEMENT (organisé par fonction) ============ -->
<a-entity id="Environnement">
  <a-sky color="#9ec9ee"></a-sky>
  <a-entity light="type: ambient; intensity: 0.7"></a-entity>
  <a-entity light="type: directional; intensity: 0.8" position="1 4 2"></a-entity>

  <!-- Sol (6 m x 6 m). Touchez-le pour vous téléporter. -->
  <a-plane id="Sol" class="interactif" teleport-sol rotation="-90 0 0" width="6" height="6"
           material="color: #c9c9c9; roughness: 0.9"></a-plane>

  <!-- Murs (hauteur 3 m) -->
  <a-plane position="0 1.5 -3" width="6" height="3" material="color: #e8eef5"></a-plane>
  <a-plane position="-3 1.5 0" rotation="0 90 0" width="6" height="3" material="color: #e8eef5"></a-plane>
  <a-plane position="3 1.5 0" rotation="0 -90 0" width="6" height="3" material="color: #e8eef5"></a-plane>
  <a-plane position="0 1.5 3" rotation="0 180 0" width="6" height="3" material="color: #e8eef5"></a-plane>

  <!-- Table A : instruments -->
  <a-entity id="Table_A" position="-0.6 0 -1">
    <a-box position="0 0.725 0" width="1" height="0.05" depth="0.6"
           material="color: #8d6e63; roughness: 0.8"></a-box>
    <a-box position="-0.45 0.35 -0.25" width="0.05" height="0.7" depth="0.05" color="#5d4037"></a-box>
    <a-box position="0.45 0.35 -0.25" width="0.05" height="0.7" depth="0.05" color="#5d4037"></a-box>
    <a-box position="-0.45 0.35 0.25" width="0.05" height="0.7" depth="0.05" color="#5d4037"></a-box>
    <a-box position="0.45 0.35 0.25" width="0.05" height="0.7" depth="0.05" color="#5d4037"></a-box>
  </a-entity>

  <!-- Table B : plateau avec 3 zones de dépôt -->
  <a-entity id="Table_B" position="0.6 0 -1">
    <a-box position="0 0.725 0" width="1" height="0.05" depth="0.6"
           material="color: #eceff1; roughness: 0.5"></a-box>
    <a-box position="-0.45 0.35 -0.25" width="0.05" height="0.7" depth="0.05" color="#90a4ae"></a-box>
    <a-box position="0.45 0.35 -0.25" width="0.05" height="0.7" depth="0.05" color="#90a4ae"></a-box>
    <a-box position="-0.45 0.35 0.25" width="0.05" height="0.7" depth="0.05" color="#90a4ae"></a-box>
    <a-box position="0.45 0.35 0.25" width="0.05" height="0.7" depth="0.05" color="#90a4ae"></a-box>
  </a-entity>

  <!-- Panneau de mission -->
  <a-plane position="0 2.0 -2.95" width="2.4" height="0.9"
           material="color: #1b2a41; shader: flat"></a-plane>
  <a-text id="Panneau" position="0 2.0 -2.93" width="2.2" align="center" color="#ffffff"
          value="Salle de formation\nPlacez chaque instrument\ndans sa zone."></a-text>
  <a-text position="0 2.55 -2.93" width="2.2" align="center" color="#ffd54f"
          value="Prototype pédagogique - pas un dispositif médical"></a-text>
</a-entity>

<!-- ============ BLOC 4 : XR ORIGIN (rig) + caméra + curseur ============ -->
  
<!-- ============ BLOC 2 : ZONES DE DÉPÔT ============ -->
<a-entity id="Zones">
  <a-cylinder id="zone_bistouri" class="interactif" zone-depot
    position="0.3 0.755 -1" radius="0.1" height="0.01"
    color="#ef9a9a"></a-cylinder>

  <a-cylinder id="zone_pince" class="interactif" zone-depot
    position="0.6 0.755 -1" radius="0.1" height="0.01"
    color="#90caf9"></a-cylinder>

  <a-cylinder id="zone_ecarteur" class="interactif" zone-depot
    position="0.9 0.755 -1" radius="0.1" height="0.01"
    color="#a5d6a7"></a-cylinder>

  <a-text position="0.3 0.9 -1" width="0.7" align="center"
    value="Bistouri"></a-text>
  <a-text position="0.6 0.9 -1" width="0.7" align="center"
    value="Pince"></a-text>
  <a-text position="0.9 0.9 -1" width="0.7" align="center"
    value="Écarteur"></a-text>
</a-entity>

<!-- ============ BLOC 3 : OBJETS INTERACTIFS (instruments) ============ -->
<!-- Tailles >= 8 cm : visables facilement à ~2 m (voir TP3) -->
<a-entity id="Instruments">
  <a-box id="bistouri" class="interactif"
    instrument="nom: Bistouri; zone: zone_bistouri"
    position="-0.9 0.82 -1"
    width="0.22" height="0.08" depth="0.08"
    material="color: #e53935; metalness: 0.3; roughness: 0.4">
  </a-box>

  <a-cylinder id="pince" class="interactif"
    instrument="nom: Pince; zone: zone_pince"
    position="-0.6 0.84 -1" rotation="0 0 90"
    radius="0.05" height="0.2" segments-radial="8"
    material="color: #1e88e5; metalness: 0.3; roughness: 0.4">
  </a-cylinder>

  <a-cone id="ecarteur" class="interactif"
    instrument="nom: Écarteur; zone: zone_ecarteur"
    position="-0.3 0.83 -1"
    radius-bottom="0.07" radius-top="0" height="0.15"
    material="color: #43a047; metalness: 0.3; roughness: 0.4">
  </a-cone>
</a-entity>

<!-- On déplace le RIG, jamais la caméra seule. wasd : test sur ordinateur. -->
<a-entity id="rig" position="0 0 0.8" wasd-controls="acceleration: 15">
  <a-entity id="tete" camera position="0 1.6 0" look-controls>
    <a-entity id="curseur" cursor="fuse: false" raycaster="objects: .interactif; far: 8"
              position="0 0 -1"
              geometry="primitive: ring; radiusInner: 0.012; radiusOuter: 0.02"
              material="color: #ffffff; shader: flat; opacity: 0.9"></a-entity>
  </a-entity>
</a-entity>

  <!-- FIN DU TEST -->

</a-scene>

<script>

let selection = null;
let score = 0;

function message(texte) {
  document.querySelector('#hud').textContent = texte;
}

function bip(frequence = 600) {
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  if (!AudioCtx) return;
  const ctx = new AudioCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();

  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.frequency.value = frequence;
  gain.gain.value = 0.08;

  osc.start();
  osc.stop(ctx.currentTime + 0.12);
  osc.onended = () => ctx.close();
}

AFRAME.registerComponent('instrument', {
  schema: {
    nom: {type: 'string'},
    zone: {type: 'string'}
  },

  init: function () {
    this.el.addEventListener('click', () => {
      if (this.el.dataset.place === 'oui') return;

      selection = this.el;
      message('Instrument sélectionné : ' + this.data.nom +
              '. Visez sa zone de dépôt.');
      bip(500);
    });
  }
});

AFRAME.registerComponent('zone-depot', {
  init: function () {
    this.el.addEventListener('click', () => {
      if (!selection) {
        message('Sélectionnez d’abord un instrument.');
        return;
      }

      const zoneCorrecte = selection.getAttribute('instrument').zone;

      if (this.el.id === zoneCorrecte) {
        const position = this.el.getAttribute('position');

        selection.setAttribute('position', {
          x: position.x,
          y: position.y + 0.08,
          z: position.z
        });

        selection.dataset.place = 'oui';
        selection = null;
        score++;

        bip(900);
        message('Bravo ! Instrument bien placé. Score : ' + score + '/3');

        if (score === 3) {
          message('Mission réussie ! Tous les instruments sont placés.');
        }
      } else {
        bip(200);
        message('Mauvaise zone ! Essayez encore.');
      }
    });
  }
});

AFRAME.registerComponent('teleport-sol', {
  init: function () {
    this.el.addEventListener('click', (evt) => {
      if (!evt.detail.intersection) return;

      const point = evt.detail.intersection.point;
      const rig = document.querySelector('#rig');

      rig.setAttribute('position', {
        x: point.x,
        y: 0,
        z: point.z
      });

      message('Téléportation effectuée.');
    });
  }
});
</script>
</body>
</html>
